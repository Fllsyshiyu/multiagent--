name: Deploy Query Complexity Model

on:
  push:
    branches: [main]
    paths:
      - services/query-complexity/**
      - .github/workflows/deploy-classifier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-complexity-model
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_USERNAME: ${{ vars.HF_USERNAME || 'Fllsyshiyu' }}
      HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME || 'query-complexity' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "Missing repository secret HF_TOKEN"; exit 1; }
          cp -R services/query-complexity /tmp/query-complexity-space
          cd /tmp/query-complexity-space
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git branch -M main
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}" main
